<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stream Chat</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .chat-container { max-width: 700px; margin: auto; margin-top: 50px; }
        .chat-box { height: 400px; overflow-y: auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); }
        .message { padding: 10px; border-radius: 20px; margin-bottom: 10px; max-width: 70%; }
        .user-message { background-color: #007bff; color: white; align-self: flex-end; }
        .other-message { background-color: #e9ecef; color: black; align-self: flex-start; }
        .input-group { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container chat-container">
        <h3 class="text-center mb-3">Stream Chat</h3>
        <div class="chat-box d-flex flex-column" id="messages"></div>
        <div class="input-group">
            <input type="text" id="user_id" class="form-control" placeholder="Enter User ID">
            <input type="text" id="message" class="form-control" placeholder="Type a message">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        async function sendMessage() {
            let userId = document.getElementById("user_id").value;
            let message = document.getElementById("message").value;
            let messagesContainer = document.getElementById("messages");
            
            if (!userId || !message) {
                alert("User ID and message are required!");
                return;
            }
            
            let formData = new FormData();
            formData.append("user_id", userId);
            formData.append("message", message);
            
            let response = await fetch("/send-message/", {
                method: "POST",
                body: formData,
                headers: { "X-CSRFToken": getCSRFToken() },
            });
            
            try {
                let data = await response.json();
                if (data.status === "success") {
                    let msgDiv = document.createElement("div");
                    msgDiv.classList.add("message", "user-message", "ms-auto");
                    msgDiv.innerText = `${userId}: ${message}`;
                    messagesContainer.appendChild(msgDiv);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    document.getElementById("message").value = "";
                } else {
                    console.error("Error:", data.error);
                }
            } catch (error) {
                console.error("JSON Parse Error:", error);
            }
        }

        function getCSRFToken() {
            let name = "csrftoken=";
            let decodedCookies = decodeURIComponent(document.cookie).split(";");
            for (let cookie of decodedCookies) {
                while (cookie.charAt(0) === " ") cookie = cookie.substring(1);
                if (cookie.indexOf(name) === 0) return cookie.substring(name.length, cookie.length);
            }
            return "";
        }
    </script>
</body>
</html>
