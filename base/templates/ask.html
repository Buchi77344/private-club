<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Ask List</h2>
        <button class="btn btn-primary mb-3" onclick="showForm()">Add Ask</button>
        <ul id="askList" class="list-group mb-3">
            {% for ask in ask %}
                <li class="list-group-item">{{ ask.add_title }}</li>
            {% endfor %}
        </ul>
        
        <div id="askFormContainer" class="modal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Ask</h5>
                        <button type="button" class="btn-close" onclick="hideForm()"></button>
                    </div>
                    <div class="modal-body">
                        <form id="askForm" method="POST" action="{% url 'askapi' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="add_title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="add_title" name="add_title" required>
                            </div>
                            <div class="mb-3">
                                <label for="discription" class="form-label">Description</label>
                                <textarea class="form-control" id="discription" name="discription" rows="3" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="date" class="form-label">Date</label>
                                <input type="datetime-local" class="form-control" id="date" name="date" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="responseMessage" class="mt-3"></div>
    </div>

    <script>
        function showForm() {
            document.getElementById('askFormContainer').style.display = 'block';
        }

        function hideForm() {
            document.getElementById('askFormContainer').style.display = 'none';
        }
    </script>
</body>
</html>
