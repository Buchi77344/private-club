<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../static/css/style.css" />
    <title>Login</title>
  </head>
  <body>
    <div class="">
        <div class="vh-100 row ">
            <div class="graphics-banner pt-5 pb-5 flex-column justify-content-around col-md-6 h-100">
              <div class="flex-column">
                <span class="flex-center large-logo-span">
                  <svg
                    width="117"
                    height="117"
                    viewBox="0 0 117 117"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M58.5 0C11.7 0 0 11.7 0 58.5C0 105.3 11.7 117 58.5 117C105.3 117 117 105.3 117 58.5C117 11.7 105.3 0 58.5 0ZM80.4375 95.1112H64.3012V63.3896C64.3012 58.6365 63.3896 55.4824 60.2355 55.4824C56.7645 55.4824 52.5574 60.372 52.5574 68.2792V95.1064H36.5625V24.2287L52.6012 21.4841V47.9456C56.0771 44.7964 60.9229 43.4216 65.8612 43.4216C76.3717 43.4216 80.4375 50.3246 80.4375 61.1081V95.1112Z"
                      fill="#900C3F"
                    />
                  </svg>
                </span>
      
                <h3 class="fw-bold fs-2 lt-font text-white mt-3">Hevsuite Clubx</h3>
              </div>
      
              <div class="d-flex flex-wrap gap-4 justify-content-center mt-4">
                <p class="text-white fs-4">Don’t have membership?</p>
                <button class="gradient-btn-util-fill fs-5 text-white">
                  Become a Member
                </button>
              </div>
            </div>
      
            <div class="content-container col-md-6  h-100">

                <div class = "mid-height-wrapper">
                    <div>
                        <h3 class = "fw-semibold fs-2">Hello Member!</h3>
                        <h5 class = "mt-3 fs-4 fw-medium gray-text-2">Welcome Back</h5>
        
                        <form class = "mt-5" action="">
                            <div class = "secondary-form-el-container">
                                <label class = "fw-medium " for="">Email/Membership ID</label>
                                <div class="secondary-form-el">
                                    <div class="d-flex gap-3 align-items-center w-100">
                                        <span class="flex-center">
                                            <img src="../static/img/svg/social/email.svg" alt="">
                                        </span>
                                        <input class = "flex-fill" type="text" name="" placeholder = "Enter email address"  id="">
                                    </div>
                                </div>
                            </div>
        
                            <div class = "secondary-form-el-container mt-3 ">
                                <label class = "fw-medium " for="">Password</label>
                                <div class="secondary-form-el justify-content-between">
                                    <div class="d-flex gap-3 align-items-center w-100">
                                        <span class="flex-center">
                                            <img src="../static/img/svg/password.svg" alt="">
                                        </span>
                                        <input class = "flex-fill" type="password" name="" placeholder = "Enter your password"  id="">   
                                    </div>
                                    <span class="flex-center">
                                        <img src="../static/img/svg/eye-icon.svg" alt="">
                                    </span>
                                </div>
                               
                                <div class="mt-4 d-flex flex-wrap gap-3 justify-content-between align-items-center">
                                    <div class="form-check d-flex align-items-center gap-2 ps-0 mb-0">
                                        <input
                                          class="form-check-input"
                                          type="checkbox"
                                          value=""
                                          name = ""
                                          id="rm-pd"
                                        />
                                        <label class = "gray-text-1 fw-medium mb-0" for="rm-pd">Remember password</label>
                                    </div>
        
                                    <a href = "#" class = "primary-clr-text fw-medium">Forgot  password?</a>
                                </div>
        
                            </div>
    
                            <button class="gradient-btn-util-fill pl-font w-100 mt-4 fs-5">Login</button>
                        </form>
                    </div>
    
                    <a href = "#" class = "text-center fw-medium fs-5 mt-5">Terms & Conditions, Privacy Policy and Cookie Policy</a>
                </div>
            </div>
        </div>
    </div>
  </body>
</html>
